[project]
name = "postador"
version = "1.0.0"
description = "Motor de postagem automática para Instagram e Facebook"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["postador"]

# As fontes viajam com o motor: Cinzel, Montserrat e Cormorant servem qualquer
# marca. O logo NÃO — esse é de cada cliente, em assets/img/ da pasta dele.
[tool.setuptools.package-data]
postador = ["assets/fontes/*.ttf"]

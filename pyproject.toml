[project]
name = "postador"
version = "1.0.0"
description = "Motor de postagem automática para Instagram e Facebook"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

# Só quem recorta podcast (postador.cortes) precisa do Whisper — é pesado e
# o robô de postagem não o usa. Instalar com:  pip install -e ".[cortes]"
[project.optional-dependencies]
cortes = ["faster-whisper>=1.1", "numpy>=1.26", "opencv-python-headless>=4.8,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["postador"]

# As fontes viajam com o motor: Cinzel, Montserrat e Cormorant servem qualquer
# marca. O logo NÃO — esse é de cada cliente, em assets/img/ da pasta dele.
[tool.setuptools.package-data]
postador = ["assets/fontes/*.ttf"]
